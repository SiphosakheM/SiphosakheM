name: Update TryHackMe Badge

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

# This block grants the bot permission to push the image to the repo
permissions:
  contents: write

jobs:
  update-badge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download TryHackMe Badge
        run: |
          curl -sL https://tryhackme-badges.s3.amazonaws.com/SiphosakheMathews.png -o tryhackme-badge.png

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add tryhackme-badge.png
          git commit -m "Update TryHackMe badge" || exit 0
          git push

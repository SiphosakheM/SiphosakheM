name: Update Profile Badges

# Allow the workflow to push changes
permissions:
  contents: write

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight
  workflow_dispatch: # Allows manual triggering

jobs:
  update-badges:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Download Badges
        run: |
          mkdir -p assets
          # Download TryHackMe Badge
          curl -o ./assets/tryhackme-badge.png "https://tryhackme-badges.s3.amazonaws.com/siphosakhemathews.png"
          
          # Download Hack The Box Badge
          curl -o ./assets/htb-badge.png "https://www.hackthebox.eu/badge/image/SiphosakheM"
          
      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add ./assets/tryhackme-badge.png ./assets/htb-badge.png
          git commit -m "Automated badge update" || echo "No changes to commit"
          git push

name: Update TryHackMe Badge

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tryhackme-badge-update:
    name: Update TryHackMe badge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: p4p1/tryhackme-badge-workflow@main
        with:
          username: "SiphosakheMathews"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Update TryHackMe Badge

# Allow the workflow to push changes
permissions:
  contents: write

on:
  schedule:
    - cron: '0 0 * * *' # Runs every day at midnight
  workflow_dispatch: # Allows manual triggering

jobs:
  update-badge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Download TryHackMe Badge using Username
        run: |
          mkdir -p assets
          # Downloads the image directly from TryHackMe's public bucket
          curl -o ./assets/tryhackme-badge.png "https://tryhackme-badges.s3.amazonaws.com/siphosakhemathews.png"
          
      - name: Commit and push badge
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add ./assets/tryhackme-badge.png
          git commit -m "Updated THM profile badge" || echo "No changes to commit"
          git push

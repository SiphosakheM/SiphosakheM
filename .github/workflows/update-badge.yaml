name: Update TryHackMe Badge

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-badge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download TryHackMe Badge
        run: |
          curl -sL https://tryhackme-badges.s3.amazonaws.com/SiphosakheMathews.png -o tryhackme-badge.png

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add tryhackme-badge.png
          
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Update TryHackMe badge"
            git pull --rebase origin main
            git push
          else
            echo "No changes to commit, badge is already up to date."
          fi

name: Update TryHackMe Badge

# This section tells GitHub WHEN to run the script
on:
  schedule:
    - cron: '0 0 * * *' # A standard cron job that runs daily at midnight
  workflow_dispatch: # Adds a button in GitHub so you can trigger the update manually

# This section tells GitHub WHAT to do
jobs:
  update-badge:
    runs-on: ubuntu-latest # Spins up the temporary Linux runner
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4 # Gives the runner access to your repository files

      - name: Download TryHackMe Badge
        # Uses curl to fetch your badge and save it locally as tryhackme-badge.png
        run: |
          curl -sL https://tryhackme-badges.s3.amazonaws.com/SiphosakheMathews.png -o tryhackme-badge.png

      - name: Commit and Push
        # Configures a bot account to stage, commit, and push the new image 
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add tryhackme-badge.png
          git commit -m "Update TryHackMe badge" || exit 0
          git push
